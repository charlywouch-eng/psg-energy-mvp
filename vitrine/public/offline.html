<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — PSGLOBAL-ENERGY</title>
  <style>
    :root {
      --ink: #0a0e1a;
      --blue: #1a4dff;
      --green: #00c48c;
      --gold: #f5a000;
      --white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    h1 span { color: var(--gold); }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 36ch;
      margin: 0 auto 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .contact {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
    .contact a { color: rgba(255,255,255,0.5); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>Vous êtes <span>hors ligne</span></h1>
  <p>
    Reconnectez-vous à Internet pour accéder à PSGLOBAL-ENERGY.
    Vos pages récemment consultées restent disponibles en cache.
  </p>
  <button class="btn" onclick="window.location.reload()">
    ↻ Réessayer
  </button>
  <p class="contact">
    Besoin urgent ? <a href="mailto:contact@psglobal.energy">contact@psglobal.energy</a>
  </p>
</body>
</html>
